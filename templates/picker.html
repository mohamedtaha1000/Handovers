{% extends "base.html" %}
{% block title %}New document{% endblock %}
{% block content %}
<div class="page-head">
  <h1>New handover document</h1>
  <p class="lead">Pick which document you want to generate</p>
</div>

<div class="picker-grid">
  {% for tid, spec in templates.items() %}
  <a class="picker-card" href="{{ url_for('new_document', template_id=tid) }}">
    <div class="picker-icon">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
    </div>
    <div class="picker-text">
      <div class="picker-label">{{ spec.label }}</div>
      <div class="picker-label-ar">{{ spec.label_ar }}</div>
    </div>
    <svg class="picker-arrow" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </a>
  {% endfor %}
</div>
{% endblock %}
